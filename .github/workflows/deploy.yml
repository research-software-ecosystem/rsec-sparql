name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'  # daily, to pick up new datasets from the content repository
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # Datasets from research-software-ecosystem/content and the latest EDAM.owl, as for local runs
    # (scripts/fetch-data.sh also holds the temporary fix for bioconda-dump.ttl identifiers)
    - name: Fetch data
      run: scripts/fetch-data.sh _site/data

    - name: Assemble site
      run: |
        cp index.html app.js config.js highlight.js _site/
        cp -r vendor queries _site/
        du -sh _site

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm

    - name: Install Node.js dependencies
      run: npm ci --ignore-scripts

    # Don't publish if an example query errors or stops returning results (e.g. after an upstream data change)
    - name: Check example queries
      run: npm run check-queries -- _site/data _site/queries

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: _site
        force_orphan: true
